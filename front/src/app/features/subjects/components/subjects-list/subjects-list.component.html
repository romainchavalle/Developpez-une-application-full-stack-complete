<app-navbar></app-navbar>

<div class="subject-container">
  <div class="subjects-grid">
    <div class="subject-tile" *ngFor="let subject of subjects$ | async">
      <app-subject-card
        [title]="subject.name"
        [content]="subject.content"
        [subscribed]="subject.isSubscribed"
        (createSubscription)="createSubscription(subject.id)">
      </app-subject-card>
    </div>
  </div>
</div>
