<div class="articles-container">
  <mat-grid-list cols="3" gutterSize="16px" rowHeight="200px">
    <mat-grid-tile *ngFor="let item of subjectsWithStatus$ | async">
    <app-card
      [title]="item.subject.name"
      [content]="item.subject.content"
      [isArticle]="false"
      [subscribed]="item.isSubscribed"
      (toggleSubscription)="toggle(item.subject.id, item.isSubscribed)">
    </app-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
