<div class="articles-container">
  <mat-grid-list cols="3" gutterSize="16px" rowHeight="200px">
    <mat-grid-tile *ngFor="let subject of subjects$ | async">
    <app-subject-card
      [title]="subject.name"
      [content]="subject.content"
      [subscribed]="subject.isSubscribed"
      (createSubscription)="createSubscription(subject.id)">
    </app-subject-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
