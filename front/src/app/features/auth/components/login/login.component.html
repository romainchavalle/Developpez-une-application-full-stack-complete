<app-navbar></app-navbar>

<form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Se connecter</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- Champ email / identifier -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Adresse e-mail</mat-label>
        <input
          matInput
          placeholder="exemple@domaine.com"
          formControlName="identifier"
        />
        <mat-error *ngIf="form.get('identifier')?.hasError('required')">
          L’adresse e-mail est obligatoire
        </mat-error>
      </mat-form-field>

      <!-- Champ mot de passe -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          [type]="hide ? 'password' : 'text'"
          formControlName="password"
          placeholder="••••••••"
        />
        <button
          mat-icon-button
          matSuffix
          (click)="hide = !hide"
          [attr.aria-label]="'Afficher/masquer le mot de passe'"
          [attr.aria-pressed]="!hide"
        >
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('password')?.hasError('required')">
          Le mot de passe est obligatoire
        </mat-error>
        <mat-error *ngIf="form.get('password')?.hasError('min')">
          Le mot de passe doit comporter au moins 3 caractères
        </mat-error>
      </mat-form-field>

      <!-- Message d’erreur login -->
      <div *ngIf="onError" class="error-message">
        Échec de la connexion. Vérifiez vos identifiants.
      </div>
    </mat-card-content>

    <mat-card-actions class="actions">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid"
      >
        Se connecter
      </button>
    </mat-card-actions>
  </mat-card>
</form>
