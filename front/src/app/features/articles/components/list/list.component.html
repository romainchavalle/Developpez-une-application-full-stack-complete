<p>Articles fonctionne</p>
<div class="articles-container">
  <mat-grid-list cols="3" gutterSize="16px" rowHeight="200px">
    <mat-grid-tile *ngFor="let article of articles$ | async">
      <mat-card class="article-card">

        <!-- En‑tête avec titre + date + auteur -->
        <mat-card-header>
          <mat-card-title>{{ article.title }}</mat-card-title>
          <mat-card-subtitle>
            {{ article.created_at | date: 'mediumDate' }}
            <!-- si vous avez le nom de l’auteur, remplacez authorId -->
            — Auteur {{ article.authorName}}
          </mat-card-subtitle>
        </mat-card-header>

        <!-- Extrait de contenu -->
        <mat-card-content>
          {{ article.content | slice: 0:120 }}…
        </mat-card-content>

        <!-- Boutons d’action (ex. lire la suite) -->
        <mat-card-actions>
          <button
            mat-button
            color="primary"
            [routerLink]="['/articles', article.id]"
          >
            Lire la suite
          </button>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
