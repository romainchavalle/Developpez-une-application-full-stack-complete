<app-navbar></app-navbar>

<div class="articles-container">
  <mat-card-actions class="actions">
    <button
      mat-button
      color="primary"
      routerLink="create"
    >
      Créer un article
    </button>
        <button mat-icon-button (click)="sortArticlesByDate()">
        Trier par
        <mat-icon>{{ sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
      </button>

  </mat-card-actions>

  <mat-grid-list cols="2" gutterSize="15px" rowHeight="250px">
    <mat-grid-tile *ngFor="let article of articles$ | async">
      <mat-card class="article-card"
      [class.clickable]="true"
        (click)="(goToDetail(article.id))"
      >
        <mat-card-header>
          <mat-card-title>{{ article.title }}</mat-card-title>
          <mat-card-subtitle>
            {{ article.created_at | date: 'MMM d, y' }} — {{ article.authorName }}
          </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          {{ article.content | slice:0:120 }}...
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
